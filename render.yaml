services:
  - type: web
    name: avgjoe-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    branch: main
    region: oregon
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: avgjoe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false  # set manually in dashboard (64 hex chars)
      - key: ANTHROPIC_API_KEY
        sync: false  # set manually in dashboard
      - key: FRONTEND_URL
        value: "*"  # update to your frontend URL once deployed

databases:
  - name: avgjoe-db
    databaseName: avgjoe
    region: oregon
    plan: free
